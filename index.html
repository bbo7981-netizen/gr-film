<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GR필름">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>GR 필름 보정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16130f; --panel:#201c17; --line:#3a332a; --ink:#efe6d6; --mute:#a3978339;
    --sub:#a39783; --accent:#e0a84a; --accent2:#c4502e;
  }
  [hidden]{display:none!important}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 16px) env(safe-area-inset-left);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:14px 16px 0}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 14px;border-bottom:1px solid var(--line)}
  header h1{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:15px;letter-spacing:.14em;margin:0;text-transform:uppercase}
  header h1 b{color:var(--accent);font-weight:500}
  header span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--sub);letter-spacing:.08em}

  .stage{position:relative;margin:16px 0 12px;background:#0e0c0a;border:1px solid var(--line);border-radius:6px;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  .stage canvas{display:block;max-width:100%;max-height:62vh;height:auto}
  .empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
  .empty .frame{width:72px;height:54px;border:1.5px solid var(--sub);border-radius:4px;position:relative}
  .empty .frame:after{content:"";position:absolute;width:20px;height:20px;border:1.5px solid var(--sub);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
  .badge{position:absolute;top:10px;left:10px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:3px;color:var(--ink);pointer-events:none}
  .hint{position:absolute;bottom:10px;right:10px;font-size:11px;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:3px;color:var(--sub);pointer-events:none}
  .busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(14,12,10,.6);font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;color:var(--accent)}
  .busy.on{display:flex}

  .presets{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
  .presets::-webkit-scrollbar{display:none}
  .presets .preset{flex:0 0 46%;scroll-snap-align:start}
  .strip-hint{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;color:var(--sub)}
  .preset .tag{display:inline-block;font-family:"Noto Sans KR",sans-serif;font-size:10px;letter-spacing:0;color:#1b140a;background:#8fae7a;border-radius:3px;padding:0 5px;margin-left:4px;vertical-align:1px}
  .preset{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:12px 12px 11px;text-align:left;font:inherit;cursor:pointer;position:relative}
  .preset .no{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--sub);letter-spacing:.1em}
  .preset .nm{font-weight:700;font-size:15.5px;margin:3px 0 2px}
  .preset .ds{font-size:12px;color:var(--sub);line-height:1.45}
  .preset .sw{display:flex;gap:3px;margin-top:9px}
  .preset .sw i{flex:1;height:5px;border-radius:1px}
  .preset.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .preset.on .no{color:var(--accent)}

  .ctl{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 14px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 0}
  .row+.row{border-top:1px solid var(--line)}
  .row label{font-size:13.5px;width:64px;flex:none}
  .row output{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--sub);width:40px;text-align:right;flex:none}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
  input[type=range]::-moz-range-track{height:2px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);margin-top:-10px;border:3px solid var(--bg)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}

  .recipe{margin-top:12px;font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.75;color:var(--sub);padding:0 2px}
  .recipe b{color:var(--ink);font-weight:500}

  .actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
  .actions.ready{grid-template-columns:1fr 1.3fr}
  .actions.ready #pickBtn{background:var(--panel);border-color:var(--line);color:var(--ink)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:6px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1b140a}
  .btn:disabled{opacity:.4}
  .filewrap{position:relative;overflow:hidden}
  .filewrap input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px}
  .empty .pick{margin-top:6px;padding:12px 22px;border-radius:24px;background:var(--accent);color:#1b140a;font-weight:700;font-size:14px;position:relative;overflow:hidden}

  .paste{margin-top:10px;border:1px dashed var(--line);border-radius:6px;padding:14px;text-align:center;font-size:13px;color:var(--sub);line-height:1.55;min-height:64px;outline:none;-webkit-user-select:text;user-select:text}
  .paste:focus{border-color:var(--accent);color:var(--ink)}
  .paste b{color:var(--ink)}
  .result{display:none;margin-top:16px;padding:14px;border:1px dashed var(--accent);border-radius:6px;text-align:center}
  .result.on{display:block}
  .result p{margin:0 0 10px;font-size:13px;color:var(--sub);line-height:1.5}
  .result img{max-width:100%;border-radius:4px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000;color:var(--ink);font-size:13px;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;border:1px solid var(--line);white-space:nowrap}
  .toast.on{opacity:1}

  .install{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;background:var(--panel);border:1px solid var(--accent);border-radius:8px}
  .install img{width:44px;height:44px;border-radius:10px;flex:none}
  .install .t{flex:1;font-size:13px;line-height:1.45;color:var(--sub)}
  .install .t b{display:block;color:var(--ink);font-size:14px}
  .install .go{flex:none;height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--accent);color:#1b140a;font:inherit;font-weight:700;font-size:13px}
  .install .x{flex:none;background:none;border:0;color:var(--sub);font-size:20px;padding:4px 2px;line-height:1}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet .box{width:100%;max-width:560px;background:#1f1b16;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
  .sheet h2{margin:0 0 4px;font-size:17px}
  .sheet .sub{margin:0 0 16px;font-size:13px;color:var(--sub);line-height:1.5}
  .sheet ol{margin:0;padding:0;list-style:none;counter-reset:s}
  .sheet li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
  .sheet li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1b140a;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .sheet .ico{display:inline-flex;vertical-align:-4px;padding:1px 6px;border:1px solid var(--line);border-radius:5px;margin:0 2px;font-size:13px}
  .sheet .close{margin-top:16px;width:100%}
  .sheet .arrow{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:28px;color:var(--accent);animation:bob 1s ease-in-out infinite;pointer-events:none}
  @keyframes bob{50%{transform:translate(-50%,6px)}}
  .howto{background:none;border:0;color:var(--accent);font:inherit;font-size:12.5px;text-decoration:underline;margin-top:10px;padding:6px}
  footer{margin-top:22px;font-size:11px;color:#6f6556;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GR <b>Positive</b> Film</h1>
    <span>28mm · f/2.8</span>
  </header>

  <div class="install" id="install" hidden>
    <img src="icon-192.png" alt="">
    <div class="t"><b>홈 화면에 앱으로 추가</b><span id="installSub">아이콘 누르면 바로 열려요</span></div>
    <button class="go" id="installGo">추가하기</button>
    <button class="x" id="installX" aria-label="닫기">×</button>
  </div>

  <div class="stage" id="stage">
    <div class="empty" id="empty">
      <div class="frame"></div>
      <div>사진을 불러오면<br>리코 GR3 포지티브 필름 톤으로 보정해요</div>
      <label class="pick filewrap">사진첩에서 고르기<input type="file" id="file2" accept="image/*"></label>
    </div>
    <canvas id="view" hidden></canvas>
    <div class="badge" id="badge" hidden>AFTER</div>
    <div class="hint" id="hint" hidden>꾹 누르면 원본</div>
    <div class="busy" id="busy">DEVELOPING…</div>
  </div>

  <div class="strip-hint"><span>FILM · 7</span><span>옆으로 넘겨보세요 →</span></div>
  <div class="presets" id="presets">
    <button class="preset on" data-p="daylight">
      <div class="no">① DAYLIGHT</div>
      <div class="nm">맑은 날</div>
      <div class="ds">하늘·산·풍경 · 코발트 블루, 묵직한 톤</div>
      <div class="sw"><i style="background:#1f3f86"></i><i style="background:#2a5aa8"></i><i style="background:#c43a2a"></i><i style="background:#e2b23a"></i><i style="background:#1c1a17"></i></div>
    </button>
    <button class="preset" data-p="warm">
      <div class="no">② WARM FILM</div>
      <div class="nm">따뜻한 필름</div>
      <div class="ds">건물·꽃·골목 · 앰버, 크림빛 하이라이트</div>
      <div class="sw"><i style="background:#8a4a2a"></i><i style="background:#c77a3c"></i><i style="background:#e6c48a"></i><i style="background:#6f6b3a"></i><i style="background:#3a2a20"></i></div>
    </button>
    <button class="preset" data-p="chrome">
      <div class="no">③ CLASSIC CHROME<span class="tag">FUJI 느낌</span></div>
      <div class="nm">클래식 크롬</div>
      <div class="ds">거리·다큐 · 차분한 색, 단단한 그림자</div>
      <div class="sw"><i style="background:#5d7480"></i><i style="background:#8a5a48"></i><i style="background:#b9a98f"></i><i style="background:#4a5244"></i><i style="background:#1a1a1a"></i></div>
    </button>
    <button class="preset" data-p="neg">
      <div class="no">④ CLASSIC NEG<span class="tag">FUJI 느낌</span></div>
      <div class="nm">클래식 네거</div>
      <div class="ds">일상·스냅 · 청록 그림자, 깊은 빨강</div>
      <div class="sw"><i style="background:#2f5a5a"></i><i style="background:#9a2f3a"></i><i style="background:#d8c3a0"></i><i style="background:#4f7a6a"></i><i style="background:#1c2224"></i></div>
    </button>
    <button class="preset" data-p="velvia">
      <div class="no">⑤ VELVIA<span class="tag">FUJI 느낌</span></div>
      <div class="nm">벨비아</div>
      <div class="ds">풍경·꽃 · 쨍한 원색, 진한 하늘</div>
      <div class="sw"><i style="background:#1d4fa8"></i><i style="background:#2f8a3a"></i><i style="background:#d2302a"></i><i style="background:#e8c020"></i><i style="background:#120f0c"></i></div>
    </button>
    <button class="preset" data-p="nostalgic">
      <div class="no">⑥ NOSTALGIC NEG<span class="tag">FUJI 느낌</span></div>
      <div class="nm">노스탤직 네거</div>
      <div class="ds">오후 햇살 · 앰버 하이라이트, 포근함</div>
      <div class="sw"><i style="background:#c8873e"></i><i style="background:#e7c08a"></i><i style="background:#8b4a32"></i><i style="background:#6a6a48"></i><i style="background:#2b211b"></i></div>
    </button>
    <button class="preset" data-p="acros">
      <div class="no">⑦ ACROS<span class="tag">FUJI 느낌</span></div>
      <div class="nm">아크로스 흑백</div>
      <div class="ds">인물·골목 · 깊은 흑백, 고운 입자</div>
      <div class="sw"><i style="background:#0f0f0f"></i><i style="background:#3a3a3a"></i><i style="background:#7a7a7a"></i><i style="background:#bdbdbd"></i><i style="background:#efefef"></i></div>
    </button>
  </div>

  <div class="ctl">
    <div class="row"><label for="amt">강도</label><input id="amt" type="range" min="0" max="100" value="100"><output id="amtV">100</output></div>
    <div class="row"><label for="grain">그레인</label><input id="grain" type="range" min="0" max="100" value="0"><output id="grainV">0</output></div>
  </div>

  <div class="recipe" id="recipe"></div>

  <div class="actions" id="actions">
    <label class="btn primary filewrap" id="pickBtn">사진 선택<input type="file" id="file" accept="image/*"></label>
    <button class="btn primary" id="save" hidden>보정본 저장</button>
  </div>

  <div class="paste" id="paste" contenteditable="true" inputmode="none" spellcheck="false">버튼이 안 되면: 사진 앱에서 사진을 <b>복사</b>한 뒤<br>여기를 <b>길게 눌러 붙여넣기</b></div>

  <div class="result" id="result">
    <button class="btn primary" id="shareBtn" hidden style="width:100%;margin-bottom:10px">사진 앱에 저장하기</button>
    <p id="resultMsg">아래 사진을 <b>길게 눌러 → "사진 앱에 저장"</b> 하세요</p>
    <img id="resultImg" alt="보정된 사진">
    <a class="btn" id="dlLink" style="margin-top:10px;text-decoration:none">파일로 다운로드</a>
  </div>

  <footer>사진은 기기 안에서만 처리되고 어디에도 업로드되지 않아요.<br>저장 해상도: 긴 변 최대 4000px<br><button class="howto" id="howto">📲 홈 화면에 앱으로 추가하는 법</button></footer>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" hidden><div class="box" id="sheetBox"></div></div>

<script>
(() => {
  // ───────────────────────── Presets ─────────────────────────
  // Values are tuned to read like the GR III Positive Film image control
  // with the user's parameter tweaks applied.
  const PRESETS = {
    daylight: {
      recipe: "키 <b>-2</b> · 채도 <b>+1</b> · 하이라이트 대비 <b>-4</b> · 섀도 대비 <b>+2</b> · 대비 <b>+1</b> · 샤프니스 <b>-1</b> · 명료도 <b>-3</b> · 비네팅 <b>약</b>",
      ev: -0.30,
      wb: [1.0, 1.0, 1.0],
      contrast: 0.16,       // 대비 +1 (+ Positive Film 기본 대비)
      shadow: 0.07,         // 섀도 대비 +2 → 섀도를 깊게
      knee: 0.58, shoulder: 0.46, // 하이라이트 대비 -4 → 하이라이트 부드럽게 눌러줌
      fade: 0.0,
      sat: 0.10,            // 전체 채도 +1
      hues: [               // [center°, width°, satAdd, hueTarget|null, hueAmt, valMul]
        [  2, 26, 0.22, null, 0, 0],      // 빨강
        [ 52, 22, 0.20, null, 0, 0],      // 노랑
        [ 28, 14, -0.12, null, 0, 0],     // 피부톤 보호 (빨강/노랑 부스트 상쇄)
        [195, 30, 0.30, 218, 0.55, -0.10], // 시안빛 하늘 → 코발트
        [222, 30, 0.34, 220, 0.30, -0.16], // 파랑 → 깊고 진하게
      ],
      tintS: [-0.010, 0.000, 0.018],   // 섀도: 살짝 차가운 깊이
      tintH: [0.012, 0.004, -0.010],   // 하이라이트: 아주 약간 따뜻하게
      soften: 0.30,        // 샤프니스 -1
      clarity: -0.32,      // 명료도 -3
      vignette: 0.20,
      grain: 0
    },
    warm: {
      recipe: "키 <b>-1</b> · 색온도 <b>앰버</b> · 채도 <b>+½</b> · 하이라이트 대비 <b>-4</b> · 섀도 <b>살짝 띄움</b> · 샤프니스 <b>-1</b> · 명료도 <b>-3</b> · 비네팅 · 그레인",
      ev: -0.16,
      wb: [1.055, 1.0, 0.88],
      contrast: 0.08,
      shadow: 0.02,
      knee: 0.56, shoulder: 0.52,
      fade: 0.045,          // 필름처럼 블랙을 살짝 띄움
      sat: 0.04,
      hues: [
        [  8, 26, 0.16, 14, 0.25, 0],     // 빨강 → 약간 오렌지 쪽으로
        [ 38, 20, 0.10, null, 0, 0],      // 오렌지/앰버
        [ 28, 12, -0.10, null, 0, 0],     // 피부톤 보호
        [ 58, 22, 0.08, 48, 0.3, 0],      // 노랑 → 골드
        [110, 45, -0.18, 75, 0.45, -0.04],// 초록 → 올리브, 차분하게
        [210, 40, -0.12, 195, 0.3, 0],    // 파랑 → 빈티지 틸, 채도 낮춤
      ],
      tintS: [0.020, 0.004, -0.014],   // 섀도: 따뜻한 브라운
      tintH: [0.020, 0.010, -0.018],   // 하이라이트: 크림
      soften: 0.28,
      clarity: -0.30,
      vignette: 0.26,
      grain: 30
    },
    chrome: {
      recipe: "채도 <b>-2</b> · 섀도 대비 <b>+2</b> · 하늘 <b>차분한 시안</b> · 빨강 <b>벽돌색</b> · 하이라이트 <b>살짝 따뜻</b> · 그레인 <b>약</b>",
      ev: -0.12, wb: [1.01, 1.0, 0.98],
      contrast: 0.12, shadow: 0.09, knee: 0.62, shoulder: 0.35, fade: 0.01,
      sat: -0.22,
      hues: [
        [  5, 28, -0.04, 12, 0.2, -0.06],   // 빨강 → 벽돌색

    },
    neg: {

      ev: -0.10, wb: [1.0, 1.0, 0.97],

      sat: -0.08,
      hues: [
        [  0, 24,  0.10, 355, 0.3, -0.08],  // 빨강 → 깊은 크림슨
        [ 28, 14, -0.05, 24, 0.2, 0],       // 피부톤 보호
        [ 55, 22, -0.05, 50, 0.3, 0],       // 노랑

      ],
      tintS: [-0.020, 0.008, 0.020], tintH: [0.022, 0.004, -0.006],
      soften: 0.15, clarity: -0.10, vignette: 0.18, grain: 25, mono: false
    },
    velvia: {
      recipe: "채도 <b>+3</b> · 대비 <b>+2</b> · 하늘 <b>진한 블루</b> · 초록 <b>생생하게</b> · 피부톤 <b>보호</b>",
      ev: -0.12, wb: [1.0, 1.0, 1.0],
      contrast: 0.22, shadow: 0.08, knee: 0.62, shoulder: 0.40, fade: 0.0,
      sat: 0.32,
      hues: [
        [  0, 26,  0.15, null, 0, 0],       // 빨강
        [ 28, 14, -0.24, null, 0, 0],       // 피부톤 보호 (과포화 방지)
        [ 55, 22,  0.10, null, 0, 0],       // 노랑
        [115, 50,  0.22, 120, 0.2, -0.06],  // 초록
        [215, 35,  0.25, 222, 0.3, -0.10],  // 파랑 → 깊게
        [300, 40,  0.15, null, 0, 0],       // 마젠타·보라 꽃
      ],
      tintS: [0, 0, 0], tintH: [0, 0, 0],
      soften: 0.05, clarity: 0.05, vignette: 0.12, grain: 0, mono: false
    },
    nostalgic: {
      recipe: "하이라이트 <b>앰버</b> · 대비 <b>부드럽게</b> · 섀도 <b>진하게</b> · 초록 <b>→ 올리브</b> · 명료도 <b>-2</b> · 그레인",
      ev: -0.05, wb: [1.04, 1.0, 0.90],
      contrast: 0.04, shadow: 0.07, knee: 0.55, shoulder: 0.50, fade: 0.02,
      sat: 0.0,
      hues: [
        [  5, 24,  0.08, 18, 0.2, 0],       // 빨강 → 따뜻하게
        [ 35, 20,  0.12, null, 0, 0],       // 오렌지·앰버
        [ 28, 12, -0.06, null, 0, 0],       // 피부톤 보호
        [ 55, 22,  0.05, 45, 0.3, 0],       // 노랑 → 골드
        [110, 45, -0.15, 80, 0.35, 0],      // 초록 → 올리브
        [210, 40, -0.08, 205, 0.2, 0],      // 파랑 차분하게
      ],
      tintS: [0.008, 0.0, -0.005], tintH: [0.030, 0.014, -0.022],
      soften: 0.20, clarity: -0.20, vignette: 0.18, grain: 18, mono: false
    },
    acros: {
      recipe: "흑백 · 레드 필터 느낌 · 대비 <b>+2</b> · 섀도 <b>깊게</b> · 하이라이트 <b>부드럽게</b> · 고운 그레인",
      ev: -0.08, wb: [1.0, 1.0, 1.0],
      contrast: 0.27, shadow: 0.10, knee: 0.62, shoulder: 0.36, fade: 0.012,
      sat: 0, hues: [],
      tintS: [0, 0, 0], tintH: [0, 0, 0],
      soften: 0.10, clarity: 0.05, vignette: 0.20, grain: 35,
      mono: true, monoW: [0.36, 0.54, 0.10]
    }
  };

  // ───────────────────────── State ─────────────────────────
  const $ = id => document.getElementById(id);
  const view = $('view'), vctx = view.getContext('2d');
  let srcImg = null;          // ImageBitmap/HTMLImageElement
  let fileBase = 'photo';
  let previewSrc = null;      // canvas with downscaled original
  let previewOut = null;      // ImageData processed
  let presetKey = 'daylight';
  let amount = 1, grain = 0;
  let showingOriginal = false;

  // ───────────────────────── Helpers ─────────────────────────
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }
  function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
  function drawScaled(src, maxSide){
    const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
    const s = Math.min(1, maxSide / Math.max(sw, sh));
    const w = Math.max(1, Math.round(sw*s)), h = Math.max(1, Math.round(sh*s));
    const c = makeCanvas(w,h); const x = c.getContext('2d');
    x.imageSmoothingQuality = 'high'; x.drawImage(src,0,0,w,h); return c;
  }
  // Blur by stepping down then back up (works on every mobile browser, no ctx.filter needed)
  function lowpass(src, factor){
    const w = src.width, h = src.height;
    let cur = src, cw = w, ch = h;
    const tw = Math.max(2, Math.round(w/factor)), th = Math.max(2, Math.round(h/factor));
    while (cw/2 > tw){ cw = Math.round(cw/2); ch = Math.round(ch/2); const n=makeCanvas(cw,ch); const x=n.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(cur,0,0,cw,ch); cur=n; }
    const small = makeCanvas(tw,th); const sx=small.getContext('2d'); sx.imageSmoothingQuality='high'; sx.drawImage(cur,0,0,tw,th);
    // up in two steps for smoother result
    const mid = makeCanvas(Math.min(w,tw*4), Math.min(h,th*4)); const mx=mid.getContext('2d'); mx.imageSmoothingQuality='high'; mx.drawImage(small,0,0,mid.width,mid.height);
    const out = makeCanvas(w,h); const ox=out.getContext('2d'); ox.imageSmoothingQuality='high'; ox.drawImage(mid,0,0,w,h);
    return ox.getImageData(0,0,w,h).data;
  }

  // Tone curve LUT (input 0..1 after exposure → output 0..1), 4096 steps
  function buildCurve(p){
    const N = 4096, lut = new Float32Array(N+1);
    for (let i=0;i<=N;i++){
      let x = i/N;
      // S-curve contrast around mid grey
      let y = x - p.contrast * Math.sin(2*Math.PI*x) / (2*Math.PI);
      // deepen shadows (peak effect ~0.22)
      if (y < 0.5) y -= p.shadow * Math.pow(Math.sin(Math.PI * y / 0.5), 1) * (0.5 - y) * 2;
      // soft highlight shoulder: slope 1 at knee, 1-shoulder at white
      if (y > p.knee){ const d=(y-p.knee)/(1-p.knee); y = p.knee + (1-p.knee) * d * (1 - p.shoulder*d/2); }
      // film fade (lifted blacks)
      y = p.fade + y * (1 - p.fade);
      lut[i] = Math.min(1, Math.max(0, y));
    }
    return lut;
  }

  function hueDist(a,b){ let d=Math.abs(a-b)%360; return d>180?360-d:d; }
  function shortest(a,b){ let d=(b-a)%360; if(d>180)d-=360; if(d<-180)d+=360; return d; }

  // ───────────────────────── Core pipeline ─────────────────────────
  function develop(canvas, p, amt, grainAmt){
    const w = canvas.width, h = canvas.height;
    const ctx = canvas.getContext('2d');
    const img = ctx.getImageData(0,0,w,h);
    const d = img.data;
    const scale = Math.max(w,h);
    const soft = lowpass(canvas, Math.max(2, scale/900));     // fine softness (~sharpness -1)
    const big  = lowpass(canvas, Math.max(8, scale/60));      // large radius (clarity)
    const lut = buildCurve(p), LN = lut.length - 1;
    const ev = Math.pow(2, p.ev);
    const wbR = p.wb[0]*ev, wbG = p.wb[1]*ev, wbB = p.wb[2]*ev;
    const hues = p.hues;
    const cx = w/2, cy = h/2, rmax = Math.sqrt(cx*cx+cy*cy);
    const g = grainAmt/100 * 0.07;
    const out = new Uint8ClampedArray(d.length);
    // Precompute a small grain tile for speed and a filmic (non per-pixel random) look
    const GT = 256, gtile = new Float32Array(GT*GT);
    if (g>0){ let s=12345; for(let i=0;i<gtile.length;i++){ s=(s*1103515245+12345)&0x7fffffff; const a=s/0x7fffffff; s=(s*1103515245+12345)&0x7fffffff; const b=s/0x7fffffff; gtile[i]=(a+b-1); } }
    const gscale = Math.max(1, Math.round(scale/2200));

    for (let y=0;y<h;y++){
      const dy = (y-cy)/rmax;
      for (let x=0;x<w;x++){
        const i = (y*w+x)*4;
        const or = d[i]/255, og = d[i+1]/255, ob = d[i+2]/255;
        // 1) softness (sharpness -1)
        let r = or + (soft[i]/255 - or) * p.soften;
        let gg = og + (soft[i+1]/255 - og) * p.soften;
        let b = ob + (soft[i+2]/255 - ob) * p.soften;
        // 2) clarity (negative → reduce local contrast, luminance-based to keep colours)
        const L  = 0.299*r + 0.587*gg + 0.114*b;
        const LB = (0.299*big[i] + 0.587*big[i+1] + 0.114*big[i+2]) / 255;
        const mid = 1 - Math.abs(L*2-1);                   // apply mostly in midtones
        const dl = (L - LB) * p.clarity * (0.4 + 0.6*mid);
        r += dl; gg += dl; b += dl;
        // 3) white balance + exposure
        r *= wbR; gg *= wbG; b *= wbB;
        if (p.mono){ const m = p.monoW[0]*r + p.monoW[1]*gg + p.monoW[2]*b; r = m; gg = m; b = m; }
        // 4) tone curve on luminance, ratio-preserving (avoids hue shifts / HDR look)
        // tone reference mixes luminance with max channel so saturated reds/yellows keep their brightness
        const MX = r>gg?(r>b?r:b):(gg>b?gg:b);
        let Y = 0.5*(0.2126*r + 0.7152*gg + 0.0722*b) + 0.5*MX;
        if (Y > 1e-5){
          const Yc = Math.min(1, Math.max(0, Y));
          const Yo = lut[(Yc*LN)|0];
          // blend ratio scaling with per-channel curve so highlights roll off softly
          const k = Yo / Y;
          let r1=r*k, g1=gg*k, b1=b*k;
          const rc = lut[(Math.min(1,Math.max(0,r))*LN)|0], gc = lut[(Math.min(1,Math.max(0,gg))*LN)|0], bc = lut[(Math.min(1,Math.max(0,b))*LN)|0];
          const t = Yc*Yc; // use more per-channel in highlights to prevent clipping
          r = r1 + (rc - r1)*t; gg = g1 + (gc - g1)*t; b = b1 + (bc - b1)*t;
        } else { r = lut[0]; gg = lut[0]; b = lut[0]; }
        // 5) HSV colour work
        let mx = r>gg?(r>b?r:b):(gg>b?gg:b), mn = r<gg?(r<b?r:b):(gg<b?gg:b);
        let v = mx, c = mx-mn, s = mx>0 ? c/mx : 0, hh = 0;
        if (c > 1e-6){
          if (mx===r) hh = 60*(((gg-b)/c)%6); else if (mx===gg) hh = 60*((b-r)/c+2); else hh = 60*((r-gg)/c+4);
          if (hh<0) hh+=360;
          let sAdd = p.sat, hShift = 0, vMul = 0;
          for (let k=0;k<hues.length;k++){
            const H = hues[k]; const dd = hueDist(hh, H[0]);
            if (dd < H[1]){
              const wgt = 0.5 + 0.5*Math.cos(Math.PI*dd/H[1]);
              sAdd += H[2]*wgt;
              if (H[3]!==null) hShift += shortest(hh, H[3]) * H[4] * wgt;
              vMul += H[5]*wgt*Math.min(1, s*1.6);
            }
          }
          hh = (hh + hShift + 360) % 360;
          s = Math.min(1, Math.max(0, s * (1 + sAdd)));
          v = Math.max(0, v * (1 + vMul));
          // HSV → RGB
          const C = v*s, X = C*(1-Math.abs((hh/60)%2-1)), m = v-C;
          const sec = (hh/60)|0;
          if (sec===0){r=C;gg=X;b=0;} else if(sec===1){r=X;gg=C;b=0;} else if(sec===2){r=0;gg=C;b=X;}
          else if (sec===3){r=0;gg=X;b=C;} else if(sec===4){r=X;gg=0;b=C;} else {r=C;gg=0;b=X;}
          r+=m; gg+=m; b+=m;
        }
        // 6) split toning
        const Y2 = 0.2126*r + 0.7152*gg + 0.0722*b;
        const ws = Math.max(0, 1 - Y2*2), wh = Math.max(0, Y2*2 - 1);
        r += p.tintS[0]*ws + p.tintH[0]*wh;
        gg += p.tintS[1]*ws + p.tintH[1]*wh;
        b += p.tintS[2]*ws + p.tintH[2]*wh;
        // 7) vignette (very gentle, smooth)
        const dx = (x-cx)/rmax, rr = dx*dx + dy*dy;
        const vig = 1 - p.vignette * rr * rr * 1.25;
        r *= vig; gg *= vig; b *= vig;
        // 8) grain (luminance-weighted, strongest in mids)
        if (g>0){
          const gi = (((y/gscale)|0)%GT)*GT + (((x/gscale)|0)%GT);
          const n = gtile[gi] * g * (0.35 + 0.65*(1-Math.abs(Y2*2-1)));
          r += n; gg += n; b += n;
        }
        // 9) strength mix with original
        out[i]   = (or + (r - or)*amt) * 255;
        out[i+1] = (og + (gg - og)*amt) * 255;
        out[i+2] = (ob + (b - ob)*amt) * 255;
        out[i+3] = 255;
      }
    }
    return new ImageData(out, w, h);
  }

  // ───────────────────────── UI wiring ─────────────────────────
  function setBusy(on){ $('busy').classList.toggle('on', on); }
  function renderRecipe(){ $('recipe').innerHTML = PRESETS[presetKey].recipe; }

  let pending = 0;
  function refresh(){
    if (!previewSrc) return;
    const tag = ++pending;
    setBusy(true);
    requestAnimationFrame(()=>setTimeout(()=>{
      if (tag !== pending) return;
      previewOut = develop(previewSrc, PRESETS[presetKey], amount, grain);
      paint();
      setBusy(false);
    }, 20));
  }
  function paint(){
    if (!previewSrc) return;
    view.width = previewSrc.width; view.height = previewSrc.height;
    if (showingOriginal || !previewOut) vctx.drawImage(previewSrc,0,0);
    else vctx.putImageData(previewOut,0,0);
    $('badge').textContent = showingOriginal ? 'BEFORE' : 'AFTER';
  }

  async function loadFile(f){
    if (!f) return;
    fileBase = (f.name || 'photo').replace(/\.[^.]+$/,'');
    setBusy(true);
    try{
      let bmp;
      try { bmp = await createImageBitmap(f, {imageOrientation:'from-image'}); }
      catch(_) {
        bmp = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(f); });
      }
      srcImg = bmp;
      const dpr = Math.min(2, window.devicePixelRatio||1);
      previewSrc = drawScaled(srcImg, Math.round(Math.min(1400, 560*dpr)));
      $('empty').hidden = true; view.hidden = false; $('badge').hidden = false; $('hint').hidden = false;
      $('save').hidden = false; $('save').disabled = false; $('actions').classList.add('ready'); $('pickBtn').firstChild.textContent = '다른 사진'; $('result').classList.remove('on');
      refresh();
    }catch(e){
      setBusy(false);
      toast('이 사진을 열 수 없어요 (HEIC라면 JPG로 공유해서 열어주세요)');
    }
  }

  // Paste fallback (works even where file pickers are blocked)
  const pasteBox = $('paste'), pasteHTML = pasteBox.innerHTML;
  function imageFromClipboard(e){
    const cd = e.clipboardData; if (!cd) return null;
    if (cd.files && cd.files.length){ for (const f of cd.files) if (f.type.startsWith('image/')) return f; }
    if (cd.items){ for (const it of cd.items) if (it.kind==='file' && it.type.startsWith('image/')) return it.getAsFile(); }
    return null;
  }
  document.addEventListener('paste', e => {
    const f = imageFromClipboard(e);
    e.preventDefault();
    if (f){ loadFile(f); pasteBox.blur(); window.scrollTo({top:0,behavior:'smooth'}); }
    else toast('복사된 사진이 없어요. 사진 앱에서 먼저 복사해 주세요');
    setTimeout(()=>{ pasteBox.innerHTML = pasteHTML; }, 0);
  });
  pasteBox.addEventListener('input', () => { setTimeout(()=>{ pasteBox.innerHTML = pasteHTML; }, 0); });

  ['file','file2'].forEach(id => $(id).addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value=''; }));

  $('presets').addEventListener('click', e=>{
    const btn = e.target.closest('.preset'); if (!btn) return;
    presetKey = btn.dataset.p;
    document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on', b===btn));
    grain = PRESETS[presetKey].grain; $('grain').value = grain; $('grainV').textContent = grain;
    renderRecipe(); refresh();
  });

  let slideT;
  $('amt').oninput = e => { amount = e.target.value/100; $('amtV').textContent = e.target.value; clearTimeout(slideT); slideT=setTimeout(refresh,120); };
  $('grain').oninput = e => { grain = +e.target.value; $('grainV').textContent = e.target.value; clearTimeout(slideT); slideT=setTimeout(refresh,120); };

  // press & hold to compare
  const stage = $('stage');
  const down = e => { if (!previewOut) return; showingOriginal = true; paint(); };
  const up = () => { if (!showingOriginal) return; showingOriginal = false; paint(); };
  stage.addEventListener('pointerdown', down);
  ['pointerup','pointercancel','pointerleave'].forEach(t=>stage.addEventListener(t, up));
  stage.addEventListener('contextmenu', e=>e.preventDefault());

  // ───────────────────────── Export ─────────────────────────
  let downloadsNS = null;
  try {
    if (window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(ns => { downloadsNS = ns; }).catch(()=>{});
    }
  } catch(_){}

  let lastFile = null;
  function blobToDataURL(blob){ return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); }); }
  async function showResult(blob, name){
    lastFile = new File([blob], name, {type:'image/jpeg'});
    // data: URL is what iOS Safari reliably lets you long-press → "사진 앱에 저장"
    const dataUrl = await blobToDataURL(blob);
    $('resultImg').src = dataUrl;
    const a = $('dlLink'); a.href = dataUrl; a.download = name;
    let canShare = false;
    try { canShare = !!(navigator.canShare && navigator.canShare({files:[lastFile]})); } catch(_){}
    $('shareBtn').hidden = !canShare;
    $('resultMsg').innerHTML = canShare
      ? '위 버튼 → <b>"이미지 저장"</b>을 누르세요<br>또는 사진을 길게 눌러 저장할 수 있어요'
      : '아래 사진을 <b>길게 눌러 → "사진 앱에 저장"</b> 하세요';
    $('result').classList.add('on');
    $('result').scrollIntoView({behavior:'smooth', block:'start'});
  }
  $('shareBtn').onclick = async () => {
    if (!lastFile) return;
    try { await navigator.share({ files:[lastFile] }); }
    catch(e){ if (e && e.name !== 'AbortError') toast('공유 창을 열 수 없어요. 사진을 길게 눌러 저장해 주세요'); }
  };

  $('save').onclick = async () => {
    if (!srcImg) return;
    $('save').disabled = true; setBusy(true);
    await new Promise(r=>setTimeout(r,30));
    try{
      const full = drawScaled(srcImg, 4000);
      const outData = develop(full, PRESETS[presetKey], amount, grain);
      full.getContext('2d').putImageData(outData, 0, 0);
      const blob = await new Promise(res => full.toBlob(res, 'image/jpeg', 0.95));
      const FN = {daylight:'Daylight',warm:'WarmFilm',chrome:'ClassicChrome',neg:'ClassicNeg',velvia:'Velvia',nostalgic:'NostalgicNeg',acros:'Acros'};
      const name = `${fileBase}_${FN[presetKey]||presetKey}.jpg`;
      let saved = false;
      if (downloadsNS){
        try { await downloadsNS.save({ filename: name, data: blob }); saved = true; toast('저장했어요'); }
        catch(err){
          if (err && err.code === 'declined') { toast('저장을 취소했어요'); saved = true; }
        }
      }
      if (!saved) await showResult(blob, name);
    }catch(e){
      toast('저장 중 문제가 생겼어요');
    }finally{
      setBusy(false); $('save').disabled = false;
    }
  };

  renderRecipe();
})();
</script>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const isKakao = /KAKAOTALK/i.test(ua);
  const inApp = isKakao || /Instagram|FBAN|FBAV|NAVER\(inapp|Line\/|DaumApps|everytimeApp|Band\//i.test(ua);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let deferred = null;
  const store = { get(k){ try{return localStorage.getItem(k);}catch(_){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(_){} } };

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', () => { $('install').hidden = true; });

  function sheet(html, arrow){
    $('sheetBox').innerHTML = html + '<button class="btn close" id="sheetClose">닫기</button>' + (arrow ? '<div class="arrow">⬇</div>' : '');
    $('sheet').hidden = false;
    $('sheetClose').onclick = () => { $('sheet').hidden = true; };
  }
  $('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('sheet').hidden = true; });

  async function showHow(){
    if (inApp){
      const url = location.href;
      if (isKakao){
        sheet(`<h2>사파리·크롬에서 열어주세요</h2><p class="sub">카카오톡 안에서는 홈 화면 추가와 사진 저장이 잘 안 돼요.</p>
          <ol><li><span>아래 <b>브라우저로 열기</b>를 눌러요</span></li><li><span>열린 페이지에서 다시 이 안내를 따라 추가해요</span></li></ol>
          <a class="btn primary close" style="text-decoration:none" href="kakaotalk://web/openExternal?url=${encodeURIComponent(url)}">브라우저로 열기</a>`);
      } else {
        sheet(`<h2>사파리·크롬에서 열어주세요</h2><p class="sub">지금은 다른 앱 안의 브라우저라서 홈 화면 추가가 안 돼요.</p>
          <ol><li><span>화면 위나 아래의 <span class="ico">⋯</span> 메뉴를 눌러요</span></li>
          <li><span><b>${isIOS ? 'Safari로 열기' : '다른 브라우저로 열기 / Chrome으로 열기'}</b>를 눌러요</span></li>
          <li><span>열린 페이지에서 다시 이 안내를 따라 추가해요</span></li></ol>`);
      }
      return;
    }
    if (deferred){
      deferred.prompt();
      try { await deferred.userChoice; } catch(_){}
      deferred = null; return;
    }
    if (isIOS){
      sheet(`<h2>아이폰 홈 화면에 추가</h2><p class="sub">사파리에서 3번만 누르면 돼요.</p>
        <ol><li><span>화면 아래 <span class="ico">⬆︎ 공유</span> 버튼을 눌러요<br><small style="color:var(--sub)">안 보이면 화면을 살짝 위로 스크롤하거나 <span class="ico">⋯</span>를 먼저 눌러요</small></span></li>
        <li><span>목록을 내려서 <b>홈 화면에 추가</b>를 눌러요</span></li>
        <li><span>오른쪽 위 <b>추가</b>를 누르면 끝!</span></li></ol>`, true);
    } else if (isAndroid){
      sheet(`<h2>홈 화면에 추가</h2><p class="sub">크롬·삼성 인터넷에서 3번만 누르면 돼요.</p>
        <ol><li><span>오른쪽 위 <span class="ico">⋮</span> 메뉴를 눌러요 (삼성 인터넷은 아래 <span class="ico">≡</span>)</span></li>
        <li><span><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 눌러요</span></li>
        <li><span><b>추가 / 설치</b>를 누르면 끝!</span></li></ol>`);
    } else {
      sheet(`<h2>휴대폰에서 열어주세요</h2><p class="sub">이 주소를 휴대폰의 사파리(아이폰)나 크롬(갤럭시)으로 열면 홈 화면에 추가할 수 있어요.</p>
        <p class="sub" style="color:var(--ink);word-break:break-all">${location.href}</p>`);
    }
  }

  $('installGo').onclick = showHow;
  $('howto').onclick = showHow;
  $('installX').onclick = () => { $('install').hidden = true; store.set('gr_install_dismissed', '1'); };

  if (standalone){ $('howto').hidden = true; return; }
  if ((isIOS || isAndroid) && !store.get('gr_install_dismissed')){
    if (inApp) $('installSub').textContent = '먼저 사파리·크롬에서 열어야 해요';
    $('install').hidden = false;
  }
})();
</script>
</body>
</html>
